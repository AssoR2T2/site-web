<!-- page de filtrage -->

<div id="blocFiltre">
    <div class="flexColumn FiltreTire">
        <input class="ElementFiltre" id="search" type="search" name="search" placeholder="Recherche" maxlength="50">
        <div id="filtre">
            <select class="ElementFiltre">
                <option>Plus Récent</option>
                <option>Moins Récent</option>
            </select>
            <span class="ElementFiltre">
                <label>Lieu :</label>
                <input id="searchLieu" type="text" placeholder="Lieu" maxlength="100">
            </span>
            <span class="ElementFiltre">
                <lable>Etat : </lable>
                <label>Perdu</label>
                <input type="radio" name="ChooseEtat" value="perdu">
                <label>Trouver</label>
                <input type="radio" name="ChooseEtat" value="trouve">
            </span>
        </div>
    </div>
</div>
